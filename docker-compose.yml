services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-manga_reader}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-locally}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - manga_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-manga_reader}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  manga_pgdata:

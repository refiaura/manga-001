server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:manga_reader}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:change-me-locally}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
jikan:
  base-url: ${JIKAN_BASE_URL:https://api.jikan.moe/v4}
  connect-timeout-ms: ${JIKAN_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${JIKAN_READ_TIMEOUT_MS:5000}
  cache-ttl-seconds: ${JIKAN_CACHE_TTL_SECONDS:3600}
  max-requests-per-minute: ${JIKAN_MAX_REQUESTS_PER_MINUTE:30}
